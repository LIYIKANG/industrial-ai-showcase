# ============================================================
# deploy/nginx.conf — Nginx 反向代理配置模板
#
# 使用方法（服务器上执行）：
#   1. 将本文件复制到 Nginx 配置目录：
#      sudo cp deploy/nginx.conf /etc/nginx/sites-available/pdf-analyzer
#
#   2. 将 YOUR_DOMAIN 替换为你的实际域名或服务器 IP：
#      sudo sed -i 's/YOUR_DOMAIN/yourdomain.com/g' /etc/nginx/sites-available/pdf-analyzer
#
#   3. 启用配置：
#      sudo ln -s /etc/nginx/sites-available/pdf-analyzer /etc/nginx/sites-enabled/
#
#   4. 验证并重载：
#      sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# 限制上传速率（防止滥用）
limit_req_zone $binary_remote_addr zone=pdf_upload:10m rate=10r/m;

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # HTTP 全部跳转 HTTPS（配置好 SSL 证书后启用）
    # return 301 https://$host$request_uri;

    # ── 上传大小限制（与 MAX_FILE_SIZE_MB 保持一致，留余量） ──
    client_max_body_size 110m;

    # ── 静态文件（直接由 Nginx 提供，不走 Python） ─────────────
    location /static/ {
        alias /var/www/pdf-analyzer/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── API 接口（转发到 Gunicorn） ───────────────────────────
    location /api/ {
        # 上传接口限速（每个 IP 每分钟最多 10 次请求）
        limit_req zone=pdf_upload burst=5 nodelay;

        proxy_pass         http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # AI 处理超时（与 Gunicorn timeout 对应）
        proxy_read_timeout    310s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
    }

    # ── 前端页面（转发到 Gunicorn） ───────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

