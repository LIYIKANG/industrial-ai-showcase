<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 - 客户关键词识别系统</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #1f2933;
      background:
        linear-gradient(90deg, rgba(39, 78, 62, 0.08) 0, rgba(39, 78, 62, 0.08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(39, 78, 62, 0.06) 0, rgba(39, 78, 62, 0.06) 1px, transparent 1px),
        #f5f7f6;
      background-size: 36px 36px;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .login-shell {
      width: min(960px, 100%);
      min-height: 580px;
      display: grid;
      grid-template-columns: 1fr 420px;
      border: 1px solid #dbe3df;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 18px 60px rgba(31, 41, 51, 0.12);
      overflow: hidden;
    }
    .brand-panel {
      padding: 42px;
      background: #22352e;
      color: #f8faf9;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 32px;
    }
    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .brand-lockup img {
      width: 54px;
      height: 54px;
      border-radius: 8px;
      background: #fff;
      object-fit: contain;
      padding: 6px;
      flex: 0 0 auto;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 750;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    .brand-sub {
      margin-top: 4px;
      color: #c8d7d0;
      font-size: 13px;
      line-height: 1.5;
    }
    .brand-copy h1 {
      margin: 0 0 14px;
      font-size: 34px;
      line-height: 1.18;
      letter-spacing: 0;
    }
    .brand-copy p {
      max-width: 440px;
      margin: 0;
      color: #d9e4df;
      font-size: 15px;
      line-height: 1.8;
    }
    .status-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .status-item {
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 8px;
      padding: 12px;
      min-width: 0;
    }
    .status-item strong {
      display: block;
      color: #ffffff;
      font-size: 18px;
      margin-bottom: 4px;
    }
    .status-item span {
      display: block;
      color: #bdd0c8;
      font-size: 12px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .form-panel {
      padding: 42px 38px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .form-title {
      margin: 0;
      font-size: 24px;
      line-height: 1.3;
    }
    .form-subtitle {
      margin: 8px 0 28px;
      color: #61706a;
      font-size: 14px;
      line-height: 1.6;
    }
    .field { margin-bottom: 18px; }
    label {
      display: block;
      margin-bottom: 7px;
      color: #2d3a35;
      font-size: 13px;
      font-weight: 650;
    }
    .input-wrap { position: relative; }
    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid #cfd9d4;
      border-radius: 8px;
      background: #fbfcfb;
      padding: 11px 42px 11px 12px;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: #2f6b50;
      box-shadow: 0 0 0 3px rgba(47, 107, 80, .14);
      background: #ffffff;
    }
    .toggle-password {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #52625b;
      cursor: pointer;
    }
    .toggle-password:hover { background: #eef3f0; }
    .error-box {
      display: none;
      margin-bottom: 16px;
      padding: 11px 12px;
      border: 1px solid #f1b6a8;
      border-radius: 8px;
      background: #fff4f1;
      color: #9c3321;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .error-box.active { display: block; }
    .login-button {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      background: #2f6b50;
      color: #ffffff;
      font-weight: 750;
      font-size: 15px;
      cursor: pointer;
    }
    .login-button:hover:not(:disabled) { background: #285b44; }
    .login-button:disabled { opacity: .68; cursor: wait; }
    .login-footer {
      margin-top: 24px;
      color: #75817d;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }
    @media (max-width: 820px) {
      body { padding: 14px; align-items: start; }
      .login-shell { grid-template-columns: 1fr; min-height: 0; }
      .brand-panel { padding: 26px; gap: 22px; }
      .brand-copy h1 { font-size: 26px; }
      .status-strip { grid-template-columns: 1fr; }
      .form-panel { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <main class="login-shell" aria-label="登录">
    <section class="brand-panel">
      <div class="brand-lockup">
        <img src="/static/assets/logo.png" alt="品牌 Logo" />
        <div>
          <div class="brand-title">客户关键词识别系统</div>
          <div class="brand-sub">文件上传解析 / 业务规则处理 / 校对导出</div>
        </div>
      </div>

      <div class="brand-copy">
        <h1>进入业务工作台</h1>
        <p>面向高频处理场景，登录后即可上传 PDF 或图片，按客户关键词配置识别字段，并完成校验、人工确认和导出。</p>
      </div>

      <div class="status-strip" aria-label="能力概览">
        <div class="status-item"><strong>配置化</strong><span>关键词、别名、位置和类型可替换</span></div>
        <div class="status-item"><strong>可追溯</strong><span>保留原始输入、旧值、新值和操作人</span></div>
        <div class="status-item"><strong>可校对</strong><span>缺失字段补录后再导出</span></div>
      </div>
    </section>

    <section class="form-panel">
      <h1 class="form-title">账号登录</h1>
      <p class="form-subtitle">请使用管理员分配的账号进入系统。</p>

      <div class="error-box" id="error-box"></div>

      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="username">用户名</label>
          <input id="username" name="username" type="text" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">密码</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button class="toggle-password" id="toggle-password" type="button" aria-label="显示或隐藏密码">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button class="login-button" id="login-button" type="submit">登录</button>
      </form>

      <div class="login-footer">© 2026 客户关键词识别系统</div>
    </section>
  </main>

  <script>
    var form = document.getElementById("login-form");
    var errorBox = document.getElementById("error-box");
    var loginButton = document.getElementById("login-button");
    var passwordInput = document.getElementById("password");

    document.getElementById("toggle-password").addEventListener("click", function () {
      passwordInput.type = passwordInput.type === "password" ? "text" : "password";
    });

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add("active");
    }

    function setLoading(isLoading) {
      loginButton.disabled = isLoading;
      loginButton.textContent = isLoading ? "登录中..." : "登录";
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      errorBox.classList.remove("active");
      setLoading(true);

      try {
        var response = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: passwordInput.value
          })
        });
        var data = await response.json();
        if (!response.ok) {
          showError(data.detail || "用户名或密码不正确。");
          setLoading(false);
          return;
        }
        sessionStorage.setItem("access_token", data.access_token);
        window.location.href = data.must_change_password ? "/change-password" : "/";
      } catch (error) {
        showError("网络异常，请稍后重试。");
        setLoading(false);
      }
    });

    if (sessionStorage.getItem("access_token")) {
      window.location.href = "/";
    }
  </script>
</body>
</html>
