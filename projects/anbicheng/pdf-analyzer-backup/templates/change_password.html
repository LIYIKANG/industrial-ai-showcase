<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>パスワード変更 — PDF Analyzer AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F1F5F9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .wrapper { width: 100%; max-width: 440px; }
    .brand {
      display: flex; align-items: center; gap: 12px;
      justify-content: center; margin-bottom: 28px;
    }
    .brand-icon {
      width: 40px; height: 40px; background: #2563EB; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .brand-name { font-size: 18px; font-weight: 700; color: #1E293B; }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 36px;
    }
    .card-icon {
      width: 52px; height: 52px; background: #EFF6FF; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    .card-title { font-size: 20px; font-weight: 700; color: #1E293B; margin-bottom: 6px; }
    .card-sub { font-size: 13px; color: #64748B; margin-bottom: 28px; line-height: 1.5; }

    .notice {
      background: #FFF7ED; border: 1px solid #FED7AA; border-radius: 8px;
      padding: 10px 14px; font-size: 13px; color: #C2410C;
      display: flex; gap: 8px; align-items: flex-start; margin-bottom: 20px;
    }
    .notice.hidden { display: none; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: #9CA3AF; pointer-events: none;
    }
    input[type="password"] {
      width: 100%; padding: 10px 12px 10px 38px;
      border: 1.5px solid #E2E8F0; border-radius: 8px;
      font-size: 14px; color: #1E293B; background: #F8FAFC; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); background: #fff; }

    .rules {
      font-size: 12px; color: #64748B; margin-top: 6px;
      display: flex; gap: 12px; flex-wrap: wrap;
    }
    .rule { display: flex; align-items: center; gap: 4px; }
    .rule.ok { color: #16A34A; }

    .error-box {
      background: #FEF2F2; border: 1px solid #FECACA; border-radius: 8px;
      padding: 10px 14px; margin-bottom: 16px; font-size: 13px; color: #DC2626;
      display: flex; gap: 8px; align-items: flex-start;
    }
    .error-box.hidden { display: none; }

    .btn {
      width: 100%; padding: 11px; background: #2563EB; color: #fff;
      border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
      cursor: pointer; margin-top: 8px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background 0.15s;
    }
    .btn:hover:not(:disabled) { background: #1D4ED8; }
    .btn:disabled { background: #93C5FD; cursor: not-allowed; }
    .spinner {
      display: none; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #94A3B8; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="brand">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
          <path d="M9 8h10l4 4v12a2 2 0 01-2 2H9a2 2 0 01-2-2V10a2 2 0 012-2z" fill="white" opacity="0.9"/>
          <path d="M19 8v4h4" fill="none" stroke="white" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="brand-name">PDF Analyzer AI</div>
    </div>

    <div class="card">
      <div class="card-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
      </div>
      <h1 class="card-title">パスワードを変更</h1>
      <p class="card-sub" id="card-sub">セキュリティのため、初回ログイン時にパスワードの変更が必要です。</p>

      <div class="notice hidden" id="notice">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span id="notice-text"></span>
      </div>

      <div class="error-box hidden" id="error-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="error-msg"></span>
      </div>

      <form id="form">
        <div class="form-group">
          <label>現在のパスワード</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input type="password" id="current-pw" placeholder="現在のパスワード" required />
          </div>
        </div>

        <div class="form-group">
          <label>新しいパスワード</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input type="password" id="new-pw" placeholder="新しいパスワード" required />
          </div>
          <div class="rules" id="pw-rules">
            <span class="rule" id="rule-len">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/></svg>
              8文字以上
            </span>
            <span class="rule" id="rule-upper">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/></svg>
              大文字
            </span>
            <span class="rule" id="rule-lower">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/></svg>
              小文字
            </span>
            <span class="rule" id="rule-num">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/></svg>
              数字
            </span>
          </div>
        </div>

        <div class="form-group">
          <label>新しいパスワード（確認）</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input type="password" id="confirm-pw" placeholder="もう一度入力" required />
          </div>
        </div>

        <button type="submit" class="btn" id="submit-btn">
          <span class="spinner" id="spinner"></span>
          <span id="btn-text">パスワードを変更する</span>
        </button>
      </form>
    </div>

    <div class="footer">&copy; 2026 PDF Analyzer AI</div>
  </div>

  <script>
    // 未ログインならログインページへ
    if (!sessionStorage.getItem('access_token')) {
      window.location.href = '/login';
    }

    // URLパラメータで任意変更かチェック
    var isOptional = new URLSearchParams(window.location.search).get('optional') === '1';
    if (isOptional) {
      document.getElementById('card-sub').textContent = 'パスワードを変更します。';
    }

    // パスワード強度リアルタイム表示
    document.getElementById('new-pw').addEventListener('input', function () {
      var v = this.value;
      setRule('rule-len', v.length >= 8);
      setRule('rule-upper', /[A-Z]/.test(v));
      setRule('rule-lower', /[a-z]/.test(v));
      setRule('rule-num', /[0-9]/.test(v));
    });

    function setRule(id, ok) {
      var el = document.getElementById(id);
      el.classList.toggle('ok', ok);
      el.querySelector('svg').innerHTML = ok
        ? '<polyline points="20 6 9 17 4 12" stroke="currentColor" stroke-width="2.5" fill="none"/>'
        : '<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2.5" fill="none"/>';
    }

    function showError(msg) {
      var box = document.getElementById('error-box');
      document.getElementById('error-msg').textContent = msg;
      box.classList.remove('hidden');
    }
    function hideError() { document.getElementById('error-box').classList.add('hidden'); }

    function setLoading(on) {
      document.getElementById('submit-btn').disabled = on;
      document.getElementById('spinner').style.display = on ? 'block' : 'none';
      document.getElementById('btn-text').textContent = on ? '変更中...' : 'パスワードを変更する';
    }

    document.getElementById('form').addEventListener('submit', async function (e) {
      e.preventDefault();
      hideError();

      var current = document.getElementById('current-pw').value;
      var newPw = document.getElementById('new-pw').value;
      var confirm = document.getElementById('confirm-pw').value;

      if (newPw !== confirm) { showError('新しいパスワードが一致しません。'); return; }

      setLoading(true);

      try {
        var resp = await fetch('/auth/change-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + sessionStorage.getItem('access_token'),
          },
          body: JSON.stringify({ current_password: current, new_password: newPw }),
        });

        var data = await resp.json();
        if (!resp.ok) { showError(data.detail || '変更に失敗しました。'); setLoading(false); return; }

        // 成功 → メインページへ
        window.location.href = '/';

      } catch (err) {
        showError('ネットワークエラーが発生しました。');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
